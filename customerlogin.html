<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login | Shop Finder</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* Global */
body {
    font-family: 'Poppins', sans-serif;
    background: #f7f9fc;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

a {
    text-decoration: none;
}

/* Login Box */
.login-box {
    background: #fff;
    padding: 40px 50px;
    border-radius: 15px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 400px;
    text-align: center;
}

.login-box h2 {
    margin-bottom: 25px;
    color: #2d98da;
}

/* Top Navigation Buttons */
.top-nav {
    margin-bottom: 30px;
}

.nav-btn {
    text-decoration: none;
    padding: 10px 25px;
    margin: 0 10px 15px 10px;
    background: linear-gradient(45deg, #4facfe, #007BFF);
    color: white;
    border-radius: 25px;
    font-weight: 600;
    transition: 0.3s;
    display: inline-block;
}

.nav-btn:hover {
    background: linear-gradient(45deg, #007BFF, #4facfe);
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

/* Form */
form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

input[type="email"],
input[type="password"] {
    padding: 12px 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
    transition: 0.3s;
}

input[type="email"]:focus,
input[type="password"]:focus {
    border-color: #2d98da;
    box-shadow: 0 0 8px rgba(45,152,218,0.3);
    outline: none;
}

button {
    padding: 12px;
    border: none;
    border-radius: 25px;
    background: linear-gradient(45deg, #4facfe, #007BFF);
    color: #fff;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: linear-gradient(45deg, #007BFF, #4facfe);
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

/* Register Link */
p {
    margin-top: 15px;
    font-size: 14px;
}

p a {
    color: #2d98da;
    font-weight: 600;
}

p a:hover {
    text-decoration: underline;
}

/* Footer */
.footer {
    text-align: center;
    margin-top: 40px;
    font-size: 14px;
    color: #555;
}

.footer span {
    color: #ffeaa7;
}

/* Responsive */
@media(max-width: 480px){
    .login-box {
        padding: 30px 20px;
    }

    .nav-btn {
        padding: 8px 18px;
        margin: 5px;
    }
}
</style>
</head>
<body>


<div class="login-box">
   <div class="top-nav">
        <a href="index.php" class="nav-btn">Back Home</a>
        <a href="shoplogin.html" class="nav-btn">Shop Login</a>
   </div>

    <h2>Login as Customer</h2>

    <form action="customerlogin.php" method="POST">
        <input type="email" name="email" placeholder="Customer Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="customerregister.html">Register</a></p>
<p><a href="forgotpassword.php">Forgot Password?</a></p>

</div>


</body>
</html>
